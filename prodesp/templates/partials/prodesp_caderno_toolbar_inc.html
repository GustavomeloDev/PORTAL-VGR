{# Toolbar Caderno de Teste — prefix: edit | view | create | details #}
<div class="col-12 prodesp-caderno-toolbar{% if admin_user != 1 %} d-none{% endif %}" id="{{ prefix }}CadernoTesteToolbar" data-prodesp-caderno-prefix="{{ prefix }}">
  <div class="card border-primary bg-light">
    <div class="card-body py-3">
      <h6 class="text-primary mb-2"><i class="fas fa-file-excel me-1"></i>Caderno de Teste automático</h6>
      <p class="small text-muted mb-2 mb-md-0">
        Coleta logs via SSH (jump → loopback) e gera o .xlsm oficial. Disponível na etapa «Em Caderno de Teste»{% if admin_user == 1 %} — administradores veem esta barra em qualquer substatus{% endif %}.
      </p>
      <div class="d-flex flex-wrap gap-2 mt-2 align-items-center">
        <button type="button" class="btn btn-sm btn-outline-primary prodesp-caderno-btn-coletar"{% if prefix == 'edit' %} id="btnEditColetarLogsCaderno"{% endif %}>
          <span class="prodesp-caderno-btn-label"><i class="fas fa-terminal me-1"></i>Coletar logs</span>
          <span class="prodesp-caderno-btn-spinner d-none" aria-hidden="true">
            <span class="spinner-border spinner-border-sm me-1" role="status"></span>Coletando…
          </span>
        </button>
        <button type="button" class="btn btn-sm btn-success prodesp-caderno-btn-gerar"{% if prefix == 'edit' %} id="btnEditGerarCaderno"{% endif %}>
          <i class="fas fa-magic me-1"></i>Gerar caderno
        </button>
        <button type="button" class="btn btn-sm btn-outline-secondary prodesp-caderno-btn-copiar"{% if prefix == 'edit' %} id="btnEditCopiarCarimboNoc"{% endif %}>
          <i class="fas fa-copy me-1"></i>Copiar Carimbo NOC
        </button>
      </div>
      <div id="{{ prefix }}CadernoToolbarStatus" class="mt-2 d-none" role="status" aria-live="polite">
        <div class="d-flex align-items-start gap-2 small mb-0 p-2 rounded border bg-white">
          <span class="spinner-border spinner-border-sm text-primary flex-shrink-0 prodesp-caderno-toolbar-spinner" role="status" aria-hidden="true"></span>
          <span id="{{ prefix }}CadernoToolbarStatusText" class="text-primary fw-semibold"></span>
        </div>
      </div>
      <div id="{{ prefix }}CadernoToolbarResult" class="alert py-2 px-3 mt-2 mb-0 d-none small" role="alert"></div>
    </div>
  </div>
</div>
