{# Modal de confirmação antes de gerar Blueprint (atendimentos + criar_blueprint). #}
<div class="modal fade" id="modalBlueprintConfirm" tabindex="-1" aria-labelledby="modalBlueprintConfirmTitle" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalBlueprintConfirmTitle">Confirmar geração do Blueprint</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      <div class="modal-body">
        <div id="bpConfirmErrors" class="alert alert-danger d-none" role="alert"></div>
        <div class="mb-3">
          <label class="form-label" for="bpConfirmHostname">Hostname</label>
          <input type="text" class="form-control" id="bpConfirmHostname" autocomplete="off">
        </div>
        <div id="bpConfirmLanRows" class="bp-confirm-lan-list"></div>
        <hr>
        <h6 class="text-secondary">Gateways (somente leitura)</h6>
        <div id="bpConfirmGateways" class="small text-muted mb-3"></div>
        <div class="mb-2">
          <label class="form-label mb-0">Device Blueprint</label>
          <div class="fw-semibold" id="bpConfirmDeviceBp">—</div>
          <small class="text-muted" id="bpConfirmDeviceMotivo"></small>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" id="bpConfirmBtnGerar" data-prodesp-submit-guard
                data-prodesp-guard-label="Gerando…">
          <i class="fa-solid fa-file-csv me-1"></i> Confirmar e gerar
        </button>
      </div>
    </div>
  </div>
</div>
