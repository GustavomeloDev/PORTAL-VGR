{# Offcanvas global de avisos — incluído via portal_presence em todas as páginas autenticadas. #}
{% if current_user.is_authenticated %}
<div class="offcanvas offcanvas-end portal-notif-offcanvas" tabindex="-1" id="portalGlobalNotifOffcanvas" style="width:400px">
  <div class="offcanvas-header border-bottom">
    <h6 class="offcanvas-title mb-0"><i class="fas fa-bell me-2 text-primary"></i>Avisos rápidos</h6>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Fechar"></button>
  </div>
  <div class="offcanvas-body small d-flex flex-column">
    <p class="text-muted small mb-2 portal-notif-janela-hint">
      Avisos lidos somem desta lista após <strong>15</strong> minutos. Histórico completo na central.
    </p>
    <div class="flex-grow-1 overflow-auto" id="portalGlobalNotifBody">
      <p class="text-muted">Carregando…</p>
    </div>
    <div class="pt-2 border-top mt-2">
      <a href="{{ url_for('login.avisos_central') }}" class="btn btn-sm btn-primary w-100">
        <i class="fas fa-inbox me-1"></i>Central de avisos
      </a>
    </div>
  </div>
</div>
{% endif %}
